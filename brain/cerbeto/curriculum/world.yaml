causes:            # cause sentence, question, answer, wrong option, effect sentence (for reverse questions)
  - ["{n} left the ice cream in the sun.", "Did the ice cream melt or freeze?", melt, freeze, "The ice cream melted."]
  - ["{n} dropped a glass on the floor.", "Did the glass break or grow?", break, grow, "The glass broke."]
  - ["It rained all day.", "Was the grass wet or dry?", wet, dry, "The grass was wet."]
  - ["{n} did not eat lunch.", "Was {n} hungry or full?", hungry, full, "{n} was hungry."]
  - ["{n} ran around the park for a long time.", "Was {n} tired or sleepy?", tired, sleepy, "{n} was tired."]
  - ["{n} forgot the umbrella and it rained.", "Did {n} get wet or stay dry?", wet, dry, "{n} got wet."]
  - ["{n} watered the seeds every day.", "Did the plants grow or die?", grow, die, "The plants grew."]
  - ["{n} turned off the light.", "Was the room dark or bright?", dark, bright, "The room was dark."]
  - ["{n} put on a big warm coat in the snow.", "Was {n} warm or cold?", warm, cold, "{n} was warm."]
  - ["{n} lost the favorite toy.", "Was {n} happy or sad?", sad, happy, "{n} was sad."]
  - ["{n} got a new puppy for a birthday.", "Was {n} happy or sad?", happy, sad, "{n} was happy."]
  - ["{n} did not sleep all night.", "Was {n} tired or awake in the morning?", tired, awake, "{n} was tired in the morning."]
  - ["The balloon touched a sharp pin.", "Did the balloon pop or float?", pop, float, "The balloon popped."]
  - ["{n} put the milk in the fridge.", "Was the milk cold or hot?", cold, hot, "The milk was cold."]
causes_rare: [12, 13]   # indices kept out of training (ood_hard)
