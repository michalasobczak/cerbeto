categories:
  animal: [dog, cat, cow, horse, bird, fish, duck, pig, sheep, lion, elephant, frog, bear, mouse, rabbit, monkey, whale, bee, snake, owl]
  fruit: [apple, banana, orange, grape, pear, strawberry, cherry, lemon, peach, plum]
  vehicle: [car, bus, train, bike, boat, plane, truck]
  toy: [ball, doll, kite, teddy bear, yo-yo, puzzle]
  clothes: [shirt, hat, sock, shoe, coat, dress, scarf]
