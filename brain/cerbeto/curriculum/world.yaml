abilities:         # can X? (both directions are statements for agree/disagree)
  fly: [bird, duck, bee, owl, plane]
  swim: [fish, duck, frog, whale]
  bark: [dog]
  climb trees: [cat, monkey]
cannot:
  fly: [cat, dog, cow, pig, fish, horse, elephant, sheep]
  swim: [car, chair, rock]
  bark: [cat, cow, fish, bird]
  climb trees: [fish, elephant, whale]

routines:          # situation lines → phrases that fit, and a natural reply used as the training target
  greeting:
    say: ["Hello!", "Hi there!", "Good morning!", "Hi! Nice to see you.", "Hey, hello!", "Hi! I'm {name}.",
          "Hello! My name is {name}.", "Good morning! I'm {name}.", "Hi! It's me, {name}."]
    accept: [hi, hello, hey, good morning, morning, nice to see you]
    reply: "Hello! Nice to see you."
    situation: ["Your friend says hello to you. What do you say?", "Your teacher says good morning. What do you say back?"]
  thanks:
    say: ["Here is {gift} for you.", "This is {gift} for you.", "I made you {gift}.", "You can have {gift}.",
          "I brought you {gift}.", "Look, {gift} for you!"]
    accept: [thank you, thanks, thank]
    reply: "Thank you!"
    situation: ["Your friend gives you a birthday present. What do you say?", "Grandma gives you an apple. What do you say?"]
  goodbye:
    say: ["Bye!", "I have to go now. Goodbye!", "See you {when}!", "Bye bye, see you {when}!", "I'm going home now. Bye!",
          "Goodbye! See you {when}."]
    accept: [bye, goodbye, good bye, see you, see ya]
    reply: "Bye! See you!"
    situation: ["Your friend is going home. What do you say?", "Grandma is leaving. What do you say to her?"]
  forgive:
    say: ["I'm sorry I {oops}.", "Sorry, I {oops}.", "Oops, I {oops}. I'm sorry."]
    accept: [it's okay, that's okay, it's ok, that's ok, it's all right, it's alright, that's all right, no problem, it's fine, that's fine, okay, ok]
    reply: "That's okay."
    situation: ["Your friend says sorry for taking your toy. What do you say?"]
  apologize:
    say: ["You {hurt}!", "Ouch, you {hurt}!", "Hey, you {hurt}!"]
    accept: [sorry]
    reply: "I'm sorry."
    situation: ["You spilled your friend's juice. What do you say?", "You bumped into your teacher. What do you say?"]
  welcome:
    say: ["Thank you for {favor}!", "Thanks for {favor}!", "Thank you so much for {favor}."]
    accept: [you're welcome, you are welcome, no problem, welcome]
    reply: "You're welcome!"
    situation: ["Your friend says thank you for the toy. What do you say?"]
  bless:
    say: ["Achoo!", "Achoo! Achoo!"]
    accept: [bless you]
    reply: "Bless you!"
    situation: ["Your mom sneezes. What do you say?"]
  how_are_you:
    say: ["How are you?", "How are you today?", "How are you doing?"]
    accept: [fine, good, great, okay, ok, well, happy, not bad, very good]
    reply: "I'm fine, thank you."
    situation: ["Your teacher asks how you are. What do you say?"]

fill:              # placeholders in routine lines
  gift: [a cookie, an apple, a flower, a sticker, a balloon, a red crayon, a sandwich, a toy car, a drawing, a candy]
  when: [tomorrow, later, soon, on Monday, next week, after school]
  oops: [bumped into you, took your pencil, stepped on your toy, broke your crayon, spilled your juice, took your seat]
  hurt: [stepped on my foot, bumped into me, took my crayon, pulled my hair, broke my tower, took my ball]
  favor: [helping me, the cookie, sharing, the flower, playing with me, the sticker, waiting for me]

opinions:          # topic: [reason to like, reason not to like]
  rain: ["I can jump in puddles", "I get wet"]
  ice cream: ["it is sweet and cold", "it is too cold"]
  dogs: ["they are friendly", "they are loud"]
  carrots: ["they are crunchy", "they taste funny"]
  the park: ["I can play on the swings", "it is too far"]
  baths: ["I can play with bubbles", "the water gets in my eyes"]
  snow: ["I can build a snowman", "it is cold"]
  books: ["the stories are fun", "they are long"]
  cats: ["they are soft", "they scratch"]
  bedtime: ["I hear a story", "I want to play more"]

clarify:
  say: ["{verb} that.", "{verb} it.", "{verb} the thing.", "{verb} that one.", "Can you {lverb} it?",
        "Can you {lverb} that one?", "Put it {there}.", "Put that {there}.", "Can you do it now?"]
  verb: [Give me, Bring me, Hand me, Pass me, Get me]
  lverb: [get, bring, find, move, fix]
  there: [there, over there, up there, down there]
  accept: [which one, what do you mean, which, what, where, what thing]
  reply: "What do you mean? Which one?"

