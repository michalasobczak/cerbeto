[project]
name = "cerbeto"
version = "0.1.0"
description = "Cerbeto — a tiny neural network that grows up from random weights."
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["../LICENSE.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "psutil>=7.2.2",
    "pyarrow>=18",
    "pyyaml>=6",
    "safetensors>=0.8.0",
    "tokenizers>=0.21",
    "torch>=2.15.0",
]

[project.scripts]
cerbeto = "cerbeto.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""
