[project]
name = "cerbeto"
version = "0.1.0"
description = "Cerbeto — a tiny neural network that grows up from random weights."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pyarrow>=18",
    "pyyaml>=6",
    "tokenizers>=0.21",
]

[project.scripts]
cerbeto = "cerbeto.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
