# Student architecture (spec 0002). Growth starts from `start` and may never exceed `max_params`.
start:
  vocab_size: 8192
  d_model: 256
  n_heads: 8
  head_dim: 32
  mlp_hidden: 704          # SwiGLU hidden size (~8/3 * d_model, multiple of 64)
  n_prelude: 2
  n_core: 2                # recurrent core, repeated K times
  n_coda: 2
  max_seq_len: 512
  rope_theta: 10000.0
  norm_eps: 1.0e-6
  init_std: 0.02
recurrence:
  k_train_min: 1           # K sampled uniformly per training step
  k_train_max: 6
  k_eval: 4                # fixed K for validation and exams
max_params: 30000000       # hard limit — growth beyond it is rejected
growth:
  max_delta_loss: 0.01     # function-preservation check on a probe batch
  new_weight_std: 0.01     # init of the "reader" side of new neurons (writer side is zero)
renewal:
  fraction: 0.01           # at most 1% of MLP neurons renewed per sleep
  maturity_steps: 1000
